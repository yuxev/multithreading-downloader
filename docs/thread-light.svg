656d76" text-anchor="start">each chunk → fwrite()</text><polyline points="492,141 505,141" fill="none" stroke="#d2461f" stroke-width="1.5"/><polygon points="505,141 497.0,137.0 497.0,145.0" fill="#d2461f"/><rect x="507" y="106" width="152" height="70" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="508" y="107" width="150" height="3" fill="#d2461f" rx="2"/><text x="517" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#1f2328" text-anchor="start" letter-spacing="0">curl_easy_perform()</text><text x="517" y="160" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13" fill="#656d76" text-anchor="start">blocking download</text><polyline points="661,141 674,141" fill="none" stroke="#d2461f" stroke-width="1.5"/><polygon points="674,141 666.0,137.0 666.0,145.0" fill="#d2461f"/><rect x="676" y="106" width="152" height="70" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="677" y="107" width="150" height="3" fill="#d2461f" rx="2"/><text x="686" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#1f2328" text-anchor="start" letter-spacing="0">fclose + cleanup</text><text x="686" y="160" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13" fill="#656d76" text-anchor="start">report the result</text><text x="0" y="210" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="14" fill="#656d76" text-anchor="start" font-style="italic">Nothing is shared between threads (each has its own CURL* and FILE*), so the downloads run in parallel without locking.</text></svg>